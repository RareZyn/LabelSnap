<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7B1E2C" />
    <meta name="description" content="Snap labels, read them with OCR, and build formatted lab documents." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LabelSnap" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LabelSnap</title>
    <script>
      // Apply the saved theme and text scale before first paint.
      try {
        var t = localStorage.getItem('ls.theme');
        if (t === 'highContrast') document.documentElement.dataset.theme = 'hc';
        var s = parseFloat(localStorage.getItem('ls.textScale') || '1');
        if (s >= 1 && s <= 1.5) document.documentElement.style.fontSize = 16 * s + 'px';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>LabelSnap needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
